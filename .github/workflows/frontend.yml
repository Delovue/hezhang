name: Frontend checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'scripts/**', 'docs/**', 'README.md', '.github/workflows/frontend.yml']
  push:
    branches: [main, feat/frontend, feat/frontend-completion, 'test/**']
    paths: ['frontend/**', 'backend/**', 'scripts/**', 'docs/**', 'README.md', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.e2e/browser-tests.json
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=../.e2e/frontend-unit.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked
      - name: Install Chromium
        run: npm run test:install-browser -- --with-deps
      - name: Browser tests with isolated real backend
        run: npm run test:e2e -- --reporter=list,json --output=../.e2e/browser-artifacts
      - name: Retain frontend evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            .e2e/frontend-unit.json
            .e2e/browser-tests.json
            .e2e/browser-artifacts/
